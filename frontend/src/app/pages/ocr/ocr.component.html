<div class="grid justify-content-center">
  <div class="col-12 md:col-8 lg:col-6 xl:col-4">

    <!-- 📁 SECTION 1: Document -->
    <div class="surface-card p-5 border-round-lg shadow-2 mb-4" [formGroup]="ocrForm">
      <h2 class="text-primary mb-4">📁 Document</h2>
      <div class="grid">
        <div class="col-9 offset-3">
          <label for="documentType" class="block text-900 font-semibold mb-2">Type:</label>
          <p-dropdown
            [options]="documentTypes"
            formControlName="documentLayout"
            placeholder="Please select document type"
            inputId="documentLayout"
            class="w-full"
          ></p-dropdown>
        </div>

        <!-- Fila 2: Input archivo + Browse -->
        <div class="col-9">
          <label for="fileInput" class="block text-900 font-semibold mb-2">Picture:</label>
          <input
            pInputText
            type="text"
            [value]="documentPictureFilename"
            disabled
            class="w-full"
            placeholder="Please select a file (.png, .jpg, .jpeg, .pdf)"
          />
        </div>
        <div class="col-3">
          <button
            pButton
            type="button"
            label="Browse"
            icon="pi pi-folder-open"
            class="p-button-success w-full"
            style="margin-top: 26px;"
            (click)="fileInput.click()"
            pTooltip="Choose the image file"
          ></button>
          <input 
            type="file"
            formControlName="documentPicture"
            #fileInput 
            hidden
            (change)="onDocumentPictureSelected($event)" />
          <button
            pButton
            type="button"
            label="Read"
            icon="pi pi-search"
            class="p-button-success w-full mt-2"
            (click)="onRunOCR()"
            [disabled]="!documentPicture || ocrForm.invalid"
          ></button>
          <button
            pButton
            type="button"
            label="Reset"
            icon="pi pi-refresh"
            class="p-button-outlined w-full mt-2"
            (click)="onReset()"
          ></button>
        </div>
      </div>
    </div>

    <!-- 🧠 SECTION 2: Document Data -->
    <div class="surface-card p-5 border-round-lg shadow-2" *ngIf="ocrInvoked">
      <h2 class="text-primary mb-4">🧠 Document Data</h2>
      <div class="field">
        <label for="structuredData" class="block text-900 font-semibold mb-2">Structured Data:</label>
        <textarea
          pTextarea
          id="structuredData"
          class="w-full p-inputtextarea-resizable"
          rows="10"
          placeholder="Parsed OCR data will appear here..."
          [value]="ocrResult?.detail"
          readonly
        ></textarea>
      </div>
    </div>
  </div>
</div>
