<div class="surface-100 surface-border shadow-1">
  <p-menubar class="w-full justify-content-between" [model]="items" breakpoint="0">
    <ng-template pTemplate="start">
      <div class="flex items-center gap-2">
        <img src="assets/images/codexAI-logo.png" [alt]="appName" class="header-codex-ai-logo" />
      </div>
    </ng-template>

    <ng-template pTemplate="end">
      <div class="flex items-center gap-3">
        <a href="https://www.eniac.com" target="_blank" rel="noopener noreferrer">
          <img src="assets/images/eniac-logo.png" alt="Logo de Eniac" class="header-eniac-logo" />
        </a>
      </div>
    </ng-template>
  </p-menubar>
</div>
