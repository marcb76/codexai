<p-menubar class="shadow-2 surface-0 border-noround p-3">
  <ng-template pTemplate="start">
    <div class="flex items-center gap-2">
      <i class="pi pi-brain text-primary text-2xl"></i>
      <span class="font-bold text-xl">CodexAI</span>
    </div>
  </ng-template>

  <ng-template pTemplate="menu">
    <a
      routerLink="/ocr"
      routerLinkActive="text-primary font-bold"
      class="p-menuitem-link px-3 text-lg hover:text-primary transition-colors"
    >
      OCR
    </a>
    <a
      routerLink="/settings"
      routerLinkActive="text-primary font-bold"
      class="p-menuitem-link px-3 text-lg hover:text-primary transition-colors"
    >
      Settings
    </a>
  </ng-template>

  <ng-template pTemplate="end">
    <div class="flex items-center gap-3">
      <i class="pi pi-user text-2xl"></i>
      <span class="hidden md:inline">Hola, Marc</span>
    </div>
  </ng-template>
</p-menubar>
